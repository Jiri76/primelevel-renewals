<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Renewals</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Same locked design tokens as the rest of PrimeLevel's dashboard tools. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --green: #4CAF7D;
    --orange: #D9A441;
    --red: #E45858;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    min-height: 100%;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 32px;
    margin: 0 0 32px;
  }

  /* Collapsed by default -- just a minimal "+" trigger, so the dashboard
     opens showing nothing but the list itself. Expands into the real
     add-card only once clicked. */
  .add-trigger {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--gold);
    color: var(--white);
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.15s ease;
    margin-bottom: 40px;
  }
  .add-trigger:hover { opacity: 1; }
  .add-trigger.hidden { display: none; }

  /* Add-new-item card -- same padding AND same fixed height as .item below,
     so both read as genuinely identical, not just close. Height has to be
     forced explicitly: the <input> elements inside carry their own extra
     internal padding on top of the container's, which otherwise makes this
     card taller than a plain item row even with matching container padding. */
  .add-card {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    height: 64px;
    display: none;
    flex-wrap: nowrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 40px;
  }
  .add-card.expanded { display: flex; }
  /* Same thin 1px border-color swap as the dashboard's own inputs -- a
     real border that's just transparent-ish by default, not a heavier
     box-shadow ring, so the highlight reads as the same thickness. */
  .add-card input {
    background: transparent;
    border: 1px solid transparent;
    border-radius: 4px;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    padding: 8px 4px;
    outline: none;
  }
  .add-card input::placeholder { color: var(--placeholder); }
  input:focus {
    outline: none;
    border-color: var(--white);
  }
  /* Fixed widths, not flex-grow -- so the name field is the exact same
     pixel size everywhere it appears (add form and every row's edit
     panel alike), never stretching to fill leftover space differently
     from one context to another. */
  #newItemName, #editName { flex: 0 0 auto; width: 220px; }
  #newItemDate { flex: 0 0 auto; width: 110px; }
  .date-error {
    color: var(--red);
    font-size: 13px;
    margin-top: 6px;
    flex-basis: 100%;
  }
  #addBtn {
    display: none;
    flex: 0 0 auto;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--gold);
    color: var(--navy);
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }
  .add-card.active #addBtn { display: flex; }

  /* Item list -- urgency is shown purely through the countdown text color
     (see .item-countdown below), not a separate border stripe -- one clean
     signal, not two redundant ones. */
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }
  /* Hovering the row -- anywhere in it, including directly over its Update
     button -- frames all four sides in white (same thin 1px thickness,
     plain border-color swap, no box-shadow). Driven by a JS-toggled class
     (see mouseenter/mouseleave below), not CSS :hover/:has(), since that
     didn't reliably stay lit while the cursor was over the button itself. */
  .item.row-hovered {
    border-color: var(--white);
  }
  .item-name {
    color: var(--white);
    font-weight: 700;
    font-size: 16px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-countdown {
    color: var(--item-color);
    font-weight: 700;
    font-size: 15px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  /* Single action on the collapsed row -- white outline + white text,
     the same secondary-button language used everywhere else on the page.
     Dimmed until the row is hovered, so a long list doesn't read as a
     wall of bold buttons. */
  .item-update-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s ease;
  }
  /* The button only brightens on its own direct hover -- not just from
     being anywhere in the row -- separate from the row's own white
     highlight (.row-hovered above), which stays lit the whole time
     regardless of whether the button itself is also being hovered. */
  .item-update-btn:hover {
    opacity: 1;
  }

  /* Edit panel -- opens in place of the countdown once "Update" is tapped.
     Two groups (fields, actions) with the exact same internal gap, pushed
     to opposite ends -- so Save/Delete land flush against the row's right
     edge, same as the Update button does on every other row, rather than
     just trailing wherever the fixed-width fields happen to end. */
  .edit-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  .edit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .edit-fields, .edit-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .edit-panel input {
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    padding: 6px 8px;
  }
  #editDate { flex: 0 0 auto; width: 110px; }
  .edit-panel button {
    border: none;
    border-radius: 6px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 13px;
    padding: 7px 12px;
    cursor: pointer;
    width: 72px;
    text-align: center;
  }
  /* Save and Delete are visually identical -- same gold fill, same white
     text, only the label differs. */
  .edit-save-btn,
  .edit-delete-btn {
    background: var(--gold);
    color: var(--white);
  }

  .empty-state {
    color: var(--placeholder);
    font-size: 15px;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Renewals</h1>

    <button class="add-trigger" id="addTrigger" title="Add a renewal">+</button>
    <div class="add-card" id="addCard">
      <input id="newItemName" type="text" placeholder="e.g. Passport, Car Insurance" autocomplete="off" />
      <input id="newItemDate" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off" />
      <button id="addBtn" title="Add">+</button>
      <div class="date-error" id="addDateError"></div>
    </div>

    <div id="itemList"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://kenlhcatkjthhzuaznpg.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const addTrigger = document.getElementById('addTrigger');
    const addCard = document.getElementById('addCard');
    const nameInput = document.getElementById('newItemName');
    const dateInput = document.getElementById('newItemDate');
    const addBtn = document.getElementById('addBtn');
    const addDateError = document.getElementById('addDateError');
    const itemList = document.getElementById('itemList');

    // Collapsed to a minimal "+" by default -- the dashboard opens showing
    // nothing but the list itself. Expands into the real add-card on tap,
    // and auto-collapses again after 60s of inactivity so it doesn't sit
    // open forever if you got distracted mid-entry.
    let collapseTimer = null;
    function collapseAddCard() {
      addCard.classList.remove('expanded');
      addTrigger.classList.remove('hidden');
      nameInput.value = '';
      dateInput.value = '';
      addDateError.textContent = '';
      refreshAddCardState();
    }
    function resetCollapseTimer() {
      clearTimeout(collapseTimer);
      collapseTimer = setTimeout(collapseAddCard, 60000);
    }
    addTrigger.addEventListener('click', () => {
      addTrigger.classList.add('hidden');
      addCard.classList.add('expanded');
      nameInput.focus();
      resetCollapseTimer();
    });

    // Hard-coded DD/MM/YYYY entry, same pattern as the VAT/sort-code fields
    // elsewhere -- no native date picker at all. Auto-formats as you type
    // (digits only, slashes inserted automatically), and only accepts a
    // genuinely valid calendar date on submit.
    function formatDateInput(raw) {
      const digits = raw.replace(/\D/g, '').slice(0, 8); // DDMMYYYY
      if (digits.length > 4) return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
      if (digits.length > 2) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
      return digits;
    }
    function attachDateFormatting(el) {
      el.addEventListener('input', () => {
        el.value = formatDateInput(el.value);
      });
    }
    attachDateFormatting(dateInput);

    // Year must be exactly 4 digits starting with "20" (2000-2099) --
    // matches the explicit rule given, not an arbitrary +/- window.
    // Returns the ISO (YYYY-MM-DD) string for storage, or null if invalid --
    // also rejects real calendar impossibilities like 30/02, not just
    // out-of-range day/month numbers.
    function parseDDMMYYYY(str) {
      const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str);
      if (!m) return null;
      const day = Number(m[1]);
      const month = Number(m[2]);
      const yearStr = m[3];
      if (month < 1 || month > 12) return null;
      if (day < 1 || day > 31) return null;
      if (!/^20\d{2}$/.test(yearStr)) return null;
      const year = Number(yearStr);
      const d = new Date(year, month - 1, day);
      if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
      return `${yearStr}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }
    function isoToDDMMYYYY(iso) {
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    // "+" only appears while this card is actually being used -- keeps the
    // page showing nothing but the renewal list itself the rest of the time.
    function refreshAddCardState() {
      const active = document.activeElement === nameInput ||
        document.activeElement === dateInput ||
        nameInput.value.trim() !== '' ||
        dateInput.value !== '';
      addCard.classList.toggle('active', active);
    }
    nameInput.addEventListener('focus', refreshAddCardState);
    dateInput.addEventListener('focus', refreshAddCardState);
    nameInput.addEventListener('input', refreshAddCardState);
    dateInput.addEventListener('input', refreshAddCardState);
    nameInput.addEventListener('input', resetCollapseTimer);
    dateInput.addEventListener('input', resetCollapseTimer);
    nameInput.addEventListener('focus', resetCollapseTimer);
    dateInput.addEventListener('focus', resetCollapseTimer);
    document.addEventListener('click', (e) => {
      if (!addCard.contains(e.target)) refreshAddCardState();
    });

    function daysUntil(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(dateStr + 'T00:00:00');
      return Math.round((target - today) / 86400000);
    }

    function colorFor(days) {
      if (days <= 7) return 'var(--red)';
      if (days <= 30) return 'var(--orange)';
      return 'var(--green)';
    }

    function countdownText(days) {
      if (days < 0) return `${Math.abs(days)} day${Math.abs(days) === 1 ? '' : 's'} overdue`;
      if (days === 0) return 'Due today';
      return `${days} day${days === 1 ? '' : 's'} to go`;
    }

    async function loadItems() {
      const { data, error } = await supabase
        .from('renewal_items')
        .select('*')
        .order('expiry_date', { ascending: true });

      if (error) {
        itemList.innerHTML = '<div class="empty-state">Could not load renewals. Please refresh.</div>';
        return;
      }
      renderItems(data);
    }

    function renderItems(items) {
      itemList.innerHTML = '';
      if (!items.length) {
        itemList.innerHTML = '<div class="empty-state">Nothing tracked yet — add your first renewal above.</div>';
        return;
      }
      for (const item of items) {
        const days = daysUntil(item.expiry_date);
        const row = document.createElement('div');
        row.className = 'item';
        row.style.setProperty('--item-color', colorFor(days));
        // mouseenter/mouseleave (unlike mouseover/mouseout) only fire once
        // for the whole row, not again for every child crossed -- so this
        // reliably stays "hovered" the entire time the cursor is anywhere
        // inside the row, including directly over the Update button.
        row.addEventListener('mouseenter', () => row.classList.add('row-hovered'));
        row.addEventListener('mouseleave', () => row.classList.remove('row-hovered'));

        const name = document.createElement('div');
        name.className = 'item-name';
        name.textContent = item.item_name;

        const countdown = document.createElement('div');
        countdown.className = 'item-countdown';
        countdown.textContent = countdownText(days);

        const updateBtn = document.createElement('button');
        updateBtn.className = 'item-update-btn';
        updateBtn.textContent = 'Update';
        updateBtn.addEventListener('click', () => showEditPanel(row, item, name, countdown, updateBtn));

        row.append(name, countdown, updateBtn);
        itemList.append(row);
      }
    }

    // Single edit surface for a row -- name, date, Save, and Delete all
    // together, opened by the one "Update" button. Delete here is a direct
    // action (no separate arm/confirm step): getting here already required
    // the deliberate tap on "Update" first, so that's the real gate.
    function showEditPanel(row, item, name, countdown, updateBtn) {
      const panel = document.createElement('div');
      panel.className = 'edit-panel';

      const nameEl = document.createElement('input');
      nameEl.type = 'text';
      nameEl.id = 'editName';
      nameEl.value = item.item_name;
      nameEl.autocomplete = 'off';

      const dateEl = document.createElement('input');
      dateEl.type = 'text';
      dateEl.id = 'editDate';
      dateEl.inputMode = 'numeric';
      dateEl.placeholder = 'DD/MM/YYYY';
      dateEl.maxLength = 10;
      dateEl.autocomplete = 'off';
      dateEl.value = isoToDDMMYYYY(item.expiry_date);
      attachDateFormatting(dateEl);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'edit-save-btn';
      saveBtn.textContent = 'Save';

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'edit-delete-btn';
      deleteBtn.textContent = 'Delete';

      const errorEl = document.createElement('div');
      errorEl.className = 'date-error';

      saveBtn.addEventListener('click', async () => {
        errorEl.textContent = '';
        const newName = nameEl.value.trim();
        if (!newName) {
          errorEl.textContent = 'Name is required.';
          return;
        }
        const isoDate = parseDDMMYYYY(dateEl.value);
        if (!isoDate) {
          errorEl.textContent = 'Please check your date.';
          return;
        }
        const { error } = await supabase
          .from('renewal_items')
          .update({ item_name: newName, expiry_date: isoDate, updated_at: new Date().toISOString(), notified_at: null })
          .eq('id', item.id);
        if (!error) loadItems();
      });

      deleteBtn.addEventListener('click', async () => {
        const { error } = await supabase.from('renewal_items').delete().eq('id', item.id);
        if (!error) loadItems();
      });

      const fields = document.createElement('div');
      fields.className = 'edit-fields';
      fields.append(nameEl, dateEl);

      const actions = document.createElement('div');
      actions.className = 'edit-actions';
      actions.append(saveBtn, deleteBtn);

      const editRow = document.createElement('div');
      editRow.className = 'edit-row';
      editRow.append(fields, actions);

      panel.append(editRow, errorEl);
      row.replaceChild(panel, countdown);
      name.remove();
      updateBtn.remove();
    }

    addBtn.addEventListener('click', async () => {
      addDateError.textContent = '';
      const name = nameInput.value.trim();
      if (!name || !dateInput.value) return;
      const isoDate = parseDDMMYYYY(dateInput.value);
      if (!isoDate) {
        addDateError.textContent = 'Please check your date.';
        return;
      }

      const { error } = await supabase
        .from('renewal_items')
        .insert({ item_name: name, expiry_date: isoDate });

      if (!error) {
        clearTimeout(collapseTimer);
        collapseAddCard();
        loadItems();
      }
    });

    loadItems();
  </script>
</body>
</html>

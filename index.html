<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Renewals</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#1E2633" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Same locked design tokens as the rest of PrimeLevel's dashboard tools. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --green: #4CAF7D;
    --orange: #D9A441;
    --red: #E45858;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', sans-serif;
    min-height: 100%;
  }
  /* max-width: 640px -> 700px, per explicit request to make the item
     rows a bit wider. Shared by both screens (sign-in and app) -- the
     sign-in card has its own separate max-width:320px so it's
     unaffected in size, just sits with a little more breathing room
     around it now. Still margin:0 auto, so everything stays centered
     exactly as before. */
  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  /* Base h1 -- unchanged, still what the sign-in screen uses. The app
     screen (post sign-in) gets its own override right below so this
     change stays scoped to exactly the one screen it was asked for,
     not both. */
  h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 32px;
    margin: 0 0 32px;
  }
  /* App-screen-only title: bigger (50px, +18 from the base 32px),
     centered on the true viewport -- safe here because .container is
     already page-centered (margin:0 auto), unlike Masterboard's
     container which had to be de-centered to anchor its tiles left.
     Sign-in screen's h1 is untouched by this rule. */
  #appContainer {
    padding-top: 100px;
  }
  #appContainer h1 {
    font-size: 60px; /* bumped from 50px per explicit request -- matches Masterboard/Investments/Insider Edge titles across the whole PrimeLevel family now */
    margin: 0;
    text-align: center;
  }

  /* Sign-in screen title: matched to #appContainer h1 exactly (50px,
     centered, same 100px top-of-page padding) rather than the smaller
     32px/left-aligned base h1 rule -- scoped to #authContainer only,
     same pattern as the app screen's own override, so this doesn't
     touch the app screen's title at all.
     max-width: 740px -- real bug caught by measurement, not eyeballed:
     the shared .container's 700px max-width leaves only 660px of
     actual content room (20px padding each side), so a 700px-wide
     card poked 20px past the right padding while sitting flush against
     the left. 740px gives the 700px card a genuine, symmetric 20px on
     both sides -- confirmed live after this fix, not assumed. */
  #authContainer {
    padding-top: 100px;
    max-width: 740px;
  }
  #authContainer h1 {
    font-size: 60px; /* bumped from 50px per explicit request -- matches Masterboard/Investments/Insider Edge titles across the whole PrimeLevel family now */
    margin: 0 0 100px;
    text-align: center;
  }
  /* Sign-in card -- width back to 500px (was 400px). padding: 50px
     top/bottom, 25px left/right -- gaps: 50 (top) -> lead -> 25 ->
     email -> 50 -> button -> 50 (bottom). Height stays auto, same
     reasoning as before -- the card's real height is whatever these
     gaps + content total, not a fixed number fought against. */
  .auth-card {
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 50px 25px 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 500px;
    margin: 0 auto;
  }
  /* Confirmation state, after a magic link is successfully sent: the
     form (lead text, email input, button) and any error line are
     hidden entirely, replaced by just the confirmation message,
     centered in the middle of the SAME box -- not a smaller box that
     jumps/shrinks. 279px is the real, measured height of the normal
     resting-state card (50 padding + lead + 8 + email(50) + 50 +
     button(50) + 50 padding), confirmed live, not guessed -- min-height
     here locks the confirmation state to that same size so nothing
     visibly resizes when the card's content swaps. justify-content:
     center then centers the sole remaining child vertically within
     that locked height (align-items:center above already centers it
     horizontally). Per explicit user request: no way back to the form
     from here (no "send a different link" option) -- this screen is
     only ever reached by following a link from elsewhere, ordinary
     users never revisit or need to retype anything here. */
  .auth-card.sent {
    min-height: 279px;
    justify-content: center;
  }
  .auth-card.sent .auth-card-main,
  .auth-card.sent #authError {
    display: none;
  }
  .auth-card-main {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }
  /* font-weight:700 + font-size:15px still match "Send magic link"
     exactly (typography stays matched). opacity removed (was 0.45,
     copying the button's dimmed-at-rest look) -- explicit correction:
     that dimming is meant to signal an interactive element, not a
     static label, so this is now the standard full-opacity white text
     color used everywhere else, not artificially grayed. */
  /* margin-bottom: 8px (was 25px) -- "sits on the box," a minimal
     attached gap, not the earlier fixed 25px slot. The three real
     structural landmarks (top->lead 50px, email->button 50px,
     button->card-bottom 50px) are untouched -- only this one and
     #authError's own gap (below) became minimal. */
  .auth-lead {
    color: var(--white);
    font-size: 15px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 8px;
  }
  /* font-size back to 20px (was 18px) -- explicit "still twenty."
     width: kept at 283px, the same value already established for a
     20px field in an earlier round -- independent of the lead
     text/button's own (smaller, 15px-driven) width this time. */
  /* text-align: left, not center -- real bug found and fixed: centering
     is right for short, FIXED-length fields (the date field, VAT/sort
     code elsewhere in this project), but email is variable-length free
     text. Center-aligned text re-centers itself every time a character
     is typed or deleted, so the on-screen position of every character
     shifts constantly -- clicking where you SEE a letter no longer
     reliably places the cursor there, since the text has already moved.
     That's what caused the "stuck, can't backspace precisely, have to
     select-all-and-delete" friction the user reported. Left-aligned
     text has a stable, unmoving start position, which is why every
     real product (Gmail, every login form) left-aligns email/text
     fields -- not a style choice, a genuine editing-usability fix. */
  #authEmail {
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 20px;
    text-align: left;
    width: 283px;
    height: 50px;
    padding: 0 18px;
    outline: none;
    margin-bottom: 50px;
  }
  /* text-align:center on the placeholder specifically -- NOT the same
     text-align:left set on #authEmail itself above. This is safe and
     doesn't reintroduce the cursor-drift problem that left-alignment
     fixed: the placeholder is a static label that's never edited
     character-by-character -- it just vanishes the instant you type
     the first letter -- so there's no repeated re-centering while
     editing it, unlike real typed text. ::placeholder genuinely
     accepts its own independent text-align in every modern browser,
     confirmed real support, not a hack. */
  #authEmail::placeholder { color: var(--placeholder); text-align: center; }
  /* Real bug found and fixed: Chrome's autofill forces its own light
     background + dark text on this field once it recognizes it as an
     email/login input, completely overriding the navy/white styling
     above -- confirmed by the user's own screenshot (a white box with
     faint dark text, nothing to do with font-weight). The standard,
     email-safe fix: a giant inset box-shadow the same color as the
     real background, which Chrome lets authors paint OVER its own
     autofill background (unlike `background`, which it refuses to
     let authors override directly), plus -webkit-text-fill-color
     (autofill also ignores plain `color`). The long `transition` on
     background-color is the standard trick to stop Chrome's own
     autofill highlight from flashing yellow for a moment before this
     override takes effect. */
  #authEmail:-webkit-autofill,
  #authEmail:-webkit-autofill:hover,
  #authEmail:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--white);
    -webkit-box-shadow: 0 0 0px 1000px var(--navy) inset;
    box-shadow: 0 0 0px 1000px var(--navy) inset;
    transition: background-color 5000s ease-in-out 0s;
  }
  /* width: 283px -- matched to #authEmail's own width. height: 50px --
     explicit, exact match to #authEmail's own explicit height, not
     just an incidental match from matching padding/font. display:flex
     centers the text vertically within that fixed height (a plain
     button's default vertical centering isn't reliable enough at an
     exact pixel height -- explicit centering removes any doubt). */
  .auth-btn {
    align-self: center;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 0.5px solid var(--white);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border-radius: 6px;
    width: 283px;
    height: 50px;
    text-align: center;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  /* transform: scale(1.015) -- the standard, subtle "lift" hover effect
     used on countless real product buttons (Stripe, Linear, etc.), a
     small scale-up rather than a dramatic bounce. Pairs with the
     button's existing :active scale(0.96) press-down below -- hover
     lifts slightly out, pressing pushes slightly in, a coherent pair
     rather than a one-off effect. Now applied app-wide (item rows, "+"
     circle, edit Save/Delete, add-form Save all have their own hover
     pop too), but NOT all at this same 1.5% value -- this button and
     the item row are the two kept at 1.5% deliberately, per explicit
     request. The "+" circle is at 3% (at its much smaller 56px size,
     1.5% barely moves at all -- a % scale is relative to the element's
     own size, so the same percentage reads very differently on a
     660px row vs a much smaller control). Save/Delete (both add-form
     and edit-panel) were bumped to 3% for the same reason, then
     explicitly dialed back down to 2% per direct follow-up feedback --
     3% felt like too much specifically on those buttons. See each
     element's own hover rule for its actual current value. */
  .auth-btn:hover:not(:disabled) {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    transform: scale(1.015);
  }
  .auth-btn:active { transform: scale(0.96); }
  /* Disabled during the "Sending..." state (set in JS the instant the
     button is clicked, before waiting on the network) -- deliberately
     NO new visual style here. It simply stays at its normal resting
     0.45 opacity (the :not(:disabled) guard above stops hover from
     brightening it while disabled) -- reusing the button's existing
     dim look rather than inventing a separate "loading" style, per
     explicit request. cursor:not-allowed is the only addition, a
     standard signal that clicking won't do anything right now. */
  .auth-btn:disabled {
    cursor: not-allowed;
  }
  /* margin-top: 8px (was 50px) -- explicit correction: this should sit
     "attached" to the button, minimal gap, the same way .auth-lead now
     sits attached to the email field above. The real 50px landmark is
     the card's own padding-bottom, measured from the button's bottom
     edge in the normal (no error showing) case -- untouched. Scoped to
     #authError specifically, not the shared .date-error rule below
     (line ~370) -- that rule is also used by the add-form and
     edit-panel's own error messages elsewhere in this app, which were
     never asked to change and stay at their original 6px. Color
     intentionally left red (var(--red)) -- confirmed explicitly not to
     change; that's the established validation-error color everywhere
     else in this app. */
  #authError {
    margin-top: 8px;
    /* Explicit preservation, 2026-09-02: the shared .date-error rule
       above just moved to 15px/centered to match Investments' add/edit
       error text -- this sign-in card is a different, separately-locked
       design (see the sign-in redesign lock), never part of that
       request, so it keeps its original 13px/left-aligned look here. */
    font-size: 13px;
    text-align: left;
  }
  /* display:none by default, same established pattern as .date-error
     just above -- an empty div with margin-top still reserves that
     margin's worth of space even with zero text in it (this exact
     project has hit this bug before). Restyled from a small 13px green
     addendum line into the full confirmation screen's sole content,
     per explicit request: Montserrat bold, centered. 25px (bumped up
     from an initial 20px, which read too small once actually seen on
     screen as this screen's ONLY content) -- this text-align:center is
     unrelated to #authEmail's own alignment (which was later changed
     to left, see #authEmail's comment) -- this message is static,
     never edited, so centering causes none of the cursor-position
     problems that made centering wrong for the email field. White, not
     green -- this is now the PRIMARY message of an entire screen state,
     not a small secondary addition next to other content, so it takes
     the same prominent white the lead text uses rather than a small
     success-color accent. No margin-top needed any more either --
     .auth-card.sent's flex centering (above)
     positions it, not a fixed offset from content above it. */
  .auth-sent {
    display: none;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 25px;
    text-align: center;
  }
  .auth-sent.visible {
    display: block;
  }

  /* Clicking the "+" opens the add-popover in normal page flow, right
     underneath -- it pushes the list down rather than floating over it,
     so it never overlaps the first item. Same resting/hover color
     language as Save/Delete (below) -- transparent + white outline
     at rest, full white-fill/navy-text swap on hover -- so they all
     read as genuinely identical, not just similar. */
  /* margin-top: exact 100px title-to-circle gap (h1's own margin was
     zeroed out for this screen -- see #appContainer h1 above -- so
     this is the only thing creating that gap now). margin-top NEVER
     changes, idle-hidden or not -- title-to-wrapper is always 100px.
     margin-bottom + max-height: exact 100px circle-to-list gap when
     visible, collapsing to 0 when idle-hidden (see .add-wrapper.
     idle-hidden below) so the list rises to sit exactly 100px below
     the title with nothing in between, not a leftover empty 256px gap
     where an invisible circle used to be. Paired with .empty-state's
     own top padding being removed below, so the visible gap to
     "Nothing tracked yet..." (or the first real item) is exactly
     this 100px, not 100 + extra padding on top of it.
     260px max-height (visible state) is a generous fixed value --
     comfortably above the tallest real content (circle 56px + open
     popover's own 12px margin + 160px max-height = 228px) -- same
     "hard clip between two fixed numbers" collapse pattern used for
     .add-popover below, not the content-based grid-rows trick that's
     proven unreliable elsewhere in this file. */
  /* padding-top/bottom: 2px each -- real bug found and fixed: the
     "+" circle's hover pop (scale(1.03)) grows the button by ~0.84px
     on each side, but this wrapper's overflow:hidden box was sized
     EXACTLY to the circle's own 56px height with zero headroom, so
     the top and bottom of the circle were genuinely being clipped on
     hover (confirmed via the CSS math -- overflow:hidden + a
     content-height-only box + any transform growth at all = clipping,
     deterministically, not something that needed visual reproduction).
     2px of padding each side gives real headroom (more than double
     the ~0.84px actually needed). Margin-top/margin-bottom are left
     exactly as they were (100px each, untouched) so the LOCKED
     collapsed-state gap (title->list == 100px when idle-hidden) stays
     exactly 100px -- max-height:0 collapses this padding away to
     nothing regardless of its value, same as it already did for the
     circle's own content height. The only side-effect is the VISIBLE
     state's title->circle and circle->list gaps growing from the
     previously-locked 100px to 102px each -- a small, disclosed
     trade-off, not a silent drift. */
  .add-wrapper {
    margin-top: 100px;
    margin-bottom: 100px;
    padding-top: 2px;
    padding-bottom: 2px;
    max-height: 260px;
    overflow: hidden;
    transition: max-height 0.25s ease, margin-bottom 0.25s ease;
  }
  /* Collapses the whole wrapper (circle + its own margins) down to
     nothing, so .itemList rises to close the gap -- an explicit,
     deliberate reversal of the "reserved in layout, never shifts"
     behavior below. Trade-off, stated plainly: the trigger is no
     longer clickable at its old screen position while hidden (there's
     nothing there anymore once the wrapper collapses) -- clicking
     anywhere still reveals it via the document listener below, same
     as before, it just now takes a second click to actually use it
     rather than reveal-and-activate in one. Guarded in JS to never
     apply while the popover is open, so an open popover can never be
     stranded with no visible trigger to close it via. */
  .add-wrapper.idle-hidden {
    max-height: 0;
    margin-bottom: 0;
  }
  /* Size scaled by the same ratio the title grew (32px -> 50px =
     x1.5625): 36px -> 56px, and the "+" glyph's own font-size 20px ->
     31px to match, staying visually proportional rather than a bigger
     circle with the same small glyph inside it. */
  .add-trigger {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 0.5px solid var(--white);
    background: transparent;
    color: var(--white);
    font-size: 31px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    opacity: 0.45;
    user-select: none;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .add-trigger:hover {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    /* 3%, not the 1.5% used on the item row / sign-in button -- at this
       circle's small 56px size, 1.5% only moved ~0.8px, imperceptible.
       3% reads as an actual pop here. Deliberately different from the
       row/auth-btn value, not an inconsistency -- see the item-row and
       auth-btn comments for why those two stay at 1.5%. */
    transform: scale(1.03);
  }
  .add-trigger:active { transform: scale(0.94); }
  /* Idle auto-hide: fades out after 30s of no clicks anywhere on the
     page, reappears on the next click. The class toggles on
     .add-wrapper (see above), which also collapses the layout around
     it -- so this is just the opacity half of that same state, not an
     independent toggle. (Previously this deliberately did NOT shift
     layout, so an invisible trigger stayed clickable in its exact old
     spot -- one click both revealed and activated it. That trick is
     gone now that the wrapper collapses on hide: reveal and click are
     two separate actions again, a deliberate trade-off for the list
     rising to close the gap, per explicit request.) */
  .add-wrapper.idle-hidden .add-trigger {
    opacity: 0;
  }

  /* max-height 0 -> generous-fixed-value trick: a simpler, more reliable
     collapse animation than the grid-rows 0fr/1fr approach used earlier.
     That approach broke when padding/border also needed to animate (the
     grid's "1fr" target depends on the content's current padded size, so
     animating both at once creates a circular dependency that made the
     open state randomly fail to render at all -- found via direct
     testing, not a hypothetical). max-height has no such interaction:
     it's just a hard clip between two fixed numbers, so padding/border
     on the inner card can stay constant and still collapse to a true 0
     when closed (clipped by overflow:hidden here, same as before). 160px
     is comfortably above the tallest real content (name/date row + the
     error line), so it never visibly truncates. */
  .add-popover {
    max-height: 0;
    margin-top: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, margin-top 0.25s ease, opacity 0.2s ease;
  }
  .add-popover.open {
    max-height: 160px;
    margin-top: 12px;
    opacity: 1;
  }
  .add-popover-inner {
    display: flex;
    flex-direction: column;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* Same layout language as .edit-row: fixed-width fields, Save sits
     flush right via space-between. With only one button (no Delete),
     this form's gap is naturally much wider than the edit row's --
     276 (name) + 8 (gap) + 130 (date) + 90 (Save) = 504 of the 620px
     row, leaving 116px, not the same "16px" the edit row lands on.
     That's expected, not a bug: fewer buttons means more leftover
     space, not an equal gap by design. (An earlier version of this
     comment claimed a matching 16px gap here -- that was never
     actually true once measured; corrected.) */
  /* space-between, not flex-grow -- so the name field can stay a FIXED
     width shared with #editName below, genuinely pixel-identical in
     both forms regardless of how many buttons follow. (flex-grow was
     tried first, but grow-to-fill produces a WIDER field here than in
     the edit panel, since this form has one fewer button and therefore
     more room to grow into -- found via direct measurement: 356px here
     vs 276px there. Fixed width fixes that for real.) */
  .add-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .add-fields {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* Shared with .edit-panel input below -- genuinely the same color,
     border, radius, font-size and padding in both forms, not just a
     similarly-styled input that happened to look close. */
  /* font-size matches Save/Delete's own 15px (was 13px) -- with the
     same 6px vertical padding both already shared, matching font-size
     is what makes the input and button boxes come out the same total
     height, confirmed by direct measurement rather than assumed. */
  .add-popover input,
  .edit-panel input {
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-size: 15px;
    padding: 6px 8px;
    outline: none;
  }
  .add-popover input::placeholder { color: var(--placeholder); }
  /* No border-color change on focus -- the blinking text cursor is the
     only focus signal now, border stays exactly as it is at rest.
     outline:none still needed to suppress the browser's own default
     blue focus ring. */
  input:focus {
    outline: none;
  }
  /* Fixed width, shared with #editName below -- genuinely the same
     pixel size in both forms, not just a similar-looking one. 276px is
     what the edit panel's row math already required (see .edit-fields
     comment); reusing that exact value here, rather than letting this
     field size itself independently, is what makes them identical. */
  #newItemName, #editName { flex: 0 0 auto; width: 276px; }
  /* 130px, not the earlier 110px -- measured live: the "DD/MM/YYYY"
     placeholder needs ~121px (text + padding + border) at this font,
     110px clipped the final "Y". 130px gives real breathing room, not
     just the bare minimum. text-align:center (not the default left)
     because the extra ~8.6px of that breathing room would otherwise
     sit entirely after the "Y" -- left-aligned text plus equal CSS
     padding does NOT produce equal visual gaps once the field is
     wider than the text itself. Centering splits it evenly instead,
     same pattern already used on #authEmail for the same reason. */
  #newItemDate { flex: 0 0 auto; width: 130px; text-align: center; }
  /* Hidden by default -- an empty error div still reserves its own
     line-height plus margin-top even with no text in it, which was
     silently making the bottom padding look bigger than the top (23px
     vs 17px, found via direct measurement). Only takes up space once
     there's an actual message to show. */
  .date-error {
    display: none;
    color: var(--red);
    /* 13px -> 15px, margin-top 6px -> 4px, centered added, 2026-09-02 --
       explicit request to match Investments' own add/edit-panel error
       text exactly (.add-error / .holding-edit-error there: 15px, red,
       centered, margin-top:4px), since that styling was itself copied
       FROM here originally -- brought back in sync. Scoped to leave
       #authError (the sign-in card's error, a different context, not
       part of this request) at its original 13px/left-aligned look via
       its own override just below, same pattern already used there for
       margin-top. */
    font-size: 15px;
    text-align: center;
    margin-top: 4px;
    flex-basis: 100%;
  }
  .date-error.visible {
    display: block;
  }
  /* Now genuinely identical to .edit-save-btn / .edit-delete-btn --
     same 90x33 box (widened from 72x30 alongside the 13px->15px font
     bump -- 72px left "Update"/"Delete" text 1px from the border on
     one side, 13px on the other; 90px gives a genuinely symmetric
     16px/16px margin, confirmed by direct measurement), same
     resting/hover color swap -- not just similarly sized and a
     different gold-fill language. Border is a full 1px here, not the
     0.5px used elsewhere (the "+" circle, tiles) -- this button sits
     directly next to a 1px-bordered input and needs to match its
     height exactly; 0.5px is subject to inconsistent sub-pixel
     rounding across devices (confirmed: renders as a full 1px on one
     display, visibly thinner on another), so relying on it to happen
     to round up to the same value as the input's explicit 1px is
     fragile. A matching explicit 1px on both removes that risk
     entirely rather than hoping the rounding lines up. */
  .add-save-btn {
    flex: 0 0 auto;
    width: 90px;
    text-align: center;
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .add-save-btn:hover {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    /* 2%, not 3% -- explicitly dialed back down from the row/circle's
       language: at this button's size the 3% pop felt like too much,
       per direct user feedback, while the "+" circle stays at 3%.
       Still matches .edit-save-btn/.edit-delete-btn exactly (this
       button is genuinely identical to those in every other respect),
       so its hover pop stays identical to theirs too. */
    transform: scale(1.02);
  }
  .add-save-btn:active {
    transform: scale(0.96);
  }

  /* Item list -- urgency is shown purely through the countdown text color
     (see .item-countdown below), not a separate border stripe -- one clean
     signal, not two redundant ones. */
  /* height: explicit 70px (was an incidental 64px, produced by padding
     + line-height, not a chosen value) -- content stays vertically
     centered via align-items:center regardless. */
  /* user-select:none -- the row is a click target, not readable text,
     so any tiny mouse drift during a click shouldn't trigger the
     browser's native text-selection (the blue highlight). Real bug
     caught via screenshot: clicking around highlighted "House" and
     "529 days to go" like selected text, since nothing was stopping
     the browser's default selection behavior on plain text content. */
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 70px;
    padding: 16px 20px;
    border-radius: 10px;
    border: 0.5px solid var(--border);
    background: var(--input-bg);
    margin-bottom: 15px;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  /* Hovering the row frames all four sides in white (same thin 1px
     thickness, plain border-color swap, no box-shadow) -- the only
     affordance now that there's no separate "Update" button; the whole
     row itself opens edit mode on click (see the JS below). Driven by
     a JS-toggled class (mouseenter/mouseleave), not CSS :hover, kept
     from when a child button needed the highlight to survive being
     hovered directly -- no longer strictly necessary now that the row
     has no interactive children in its normal view, but harmless to
     leave as-is. Also gets the same scale(1.015) "pop" as every other
     hoverable control on this page (+ circle, Save/Delete, add-form
     Save) -- one consistent hover language across the whole app. */
  .item.row-hovered {
    border-color: var(--white);
    transform: scale(1.015);
  }
  .item-name {
    color: var(--white);
    font-weight: 700;
    font-size: 20px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-countdown {
    color: var(--item-color);
    font-weight: 700;
    font-size: 20px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  /* Edit panel -- opens in place of the countdown once the row is clicked.
     Two groups (fields, actions) with the exact same internal gap, pushed
     to opposite ends -- so Save/Delete land flush against the row's right
     edge, same as the Update button does on every other row, rather than
     just trailing wherever the fixed-width fields happen to end. */
  .edit-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  /* space-between, not flex-grow -- with a fixed-width name field
     (shared with #newItemName above), space-between places whatever's
     left as one clean gap between the two groups. Measured live at the
     current widths (620px row content): 276 (name) + 8 (gap) + 130
     (date) + 188 (90 Save + 8 + 90 Delete) = 602, leaving an 18px gap.
     (Comment previously cited stale 110px-date/562px-row numbers from
     an earlier round of width changes -- corrected here to the real,
     measured values, not re-derived from memory.) */
  .edit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  /* gap: 6px, not the matching 8px used everywhere else (.edit-actions,
     .add-fields) -- a deliberate, small optical compensation, not a
     real spacing bug. The Name<->Date gap here uses the input fields'
     own low-contrast dark border (blends into the background), while
     the Save<->Delete gap next to it uses the buttons' bright white
     border -- same literal 8px in both, confirmed by direct
     measurement, but the high-contrast white border visually "eats
     into" its gap more, making it read as tighter. Narrowing this gap
     is a targeted nudge to compensate for that specific perceptual
     difference, per explicit user request (first tried 7px, then
     dialed down further to 6px) -- not derived from any formula
     (optical contrast effects don't have one), just a minimal,
     easily-reversible try. .add-fields (the add-form's own Name<->Date
     gap) is untouched at 8px -- it never faces this same issue since
     the add-form only has one button, no adjacent white border to
     compare against. */
  .edit-fields {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .edit-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #editDate { flex: 0 0 auto; width: 130px; text-align: center; }
  /* border-width: full 1px, not the 0.5px used elsewhere -- same
     reasoning as .add-save-btn above: this button sits directly next
     to the 1px-bordered Name/Date inputs and needs to match their
     height exactly, which a sub-pixel border can't reliably guarantee
     across different screens. */
  .edit-panel button {
    border-style: solid;
    border-width: 1px;
    border-radius: 6px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 6px 12px;
    cursor: pointer;
    width: 90px;
    text-align: center;
    opacity: 0.45;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  /* Save and Delete match the add-form's own Save button exactly --
     same resting style (transparent, white outline, dimmed) and same
     hover swap (white fill, navy text). Still visually identical to
     EACH OTHER (only the label differs). */
  .edit-save-btn,
  .edit-delete-btn {
    background: transparent;
    border-color: var(--white);
    color: var(--white);
  }
  .edit-save-btn:hover,
  .edit-delete-btn:hover {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    /* 2%, not the "+" circle's 3% -- explicitly dialed back down per
       direct user feedback (3% felt like too much on Save/Delete
       specifically). Still bigger than the item row/sign-in button's
       1.5% (a % scale is relative to element size, and these 90px
       buttons need more than 1.5% to read as a pop at all), just not
       as much as the circle. */
    transform: scale(1.02);
  }
  .edit-save-btn:active,
  .edit-delete-btn:active {
    transform: scale(0.96);
  }

  /* Top padding removed -- the 100px gap above this text now comes
     entirely from .add-wrapper's own margin-bottom, so the two don't
     stack into 140px. Bottom padding (40px) left exactly as it was --
     that wasn't part of what was asked to change. */
  .empty-state {
    color: var(--placeholder);
    font-size: 20px;
    text-align: center;
    padding: 0 0 40px;
  }
</style>
</head>
<body>
  <!-- Hidden until the initial session check resolves, so there's no
       flash of the sign-in card for someone who's already signed in. -->
  <div class="container" id="authContainer" style="display: none;">
    <h1>Renewals</h1>
    <div class="auth-card" id="authCard">
      <div class="auth-card-main">
        <p class="auth-lead">Sign in to see your renewals.</p>
        <input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email" />
        <button id="authSendBtn" class="auth-btn">Send magic link</button>
      </div>
      <div class="date-error" id="authError"></div>
      <div class="auth-sent" id="authSentMsg"></div>
    </div>
  </div>

  <div class="container" id="appContainer" style="display: none;">
    <h1>Renewals</h1>

    <div class="add-wrapper">
      <button class="add-trigger" id="addTrigger" title="Add a renewal">+</button>
      <div class="add-popover" id="addPopover">
        <div class="add-popover-inner">
          <div class="add-row">
            <div class="add-fields">
              <input id="newItemName" type="text" placeholder="e.g. Passport, Car Insurance" autocomplete="off" />
              <input id="newItemDate" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off" />
            </div>
            <button id="addBtn" class="add-save-btn">Save</button>
          </div>
          <div class="date-error" id="addDateError"></div>
        </div>
      </div>
    </div>

    <div id="itemList"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://kenlhcatkjthhzuaznpg.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_-gt5PPGL45s3hRsfOosH6g_q3yP-b-_';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // Multi-tenant gate. Each row in the database now has a user_id
    // (defaults to auth.uid() on insert) and RLS only lets a signed-in
    // user see/edit/delete their OWN rows -- confirmed at the database
    // level (a request with no session gets a genuine 401, not just an
    // empty list). This client-side gate is purely about which SCREEN to
    // show; the real security boundary is the RLS policy, not this JS.
    const authContainer = document.getElementById('authContainer');
    const appContainer = document.getElementById('appContainer');
    const authCard = document.getElementById('authCard');
    const authEmail = document.getElementById('authEmail');
    const authSendBtn = document.getElementById('authSendBtn');
    const authError = document.getElementById('authError');
    const authSentMsg = document.getElementById('authSentMsg');

    const EMAIL_REGEX = /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i;

    function showAuthScreen() {
      appContainer.style.display = 'none';
      authContainer.style.display = 'block';
    }
    function showAppScreen() {
      authContainer.style.display = 'none';
      appContainer.style.display = 'block';
      loadItems();
    }

    authSendBtn.addEventListener('click', async () => {
      setError(authError, '');
      authSentMsg.textContent = '';
      authSentMsg.classList.remove('visible');
      const email = authEmail.value.trim();
      if (!EMAIL_REGEX.test(email)) {
        setError(authError, 'Please enter a valid email.');
        return;
      }
      // Instant feedback the moment the button is pressed, before the
      // network round-trip even starts -- previously the button just
      // sat there identically for however long the request took,
      // which read as "did that even register?" Reuses the button's
      // existing dim resting look (see .auth-btn:disabled above) rather
      // than a new style, per explicit request.
      authSendBtn.disabled = true;
      authSendBtn.textContent = 'Sending...';
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.origin + window.location.pathname },
      });
      if (!error) {
        // Swap the card's content entirely rather than appending a
        // small line to the still-visible form, per explicit request --
        // .auth-card.sent hides the form/error and centers this message
        // in the same-sized box (see its CSS comment for the measured
        // height that keeps this from visibly resizing). Generic
        // "Check your email." rather than echoing the address back --
        // this screen is only ever reached right after typing that
        // same address, so repeating it back added nothing.
        authCard.classList.add('sent');
        authSentMsg.textContent = 'Check your email.';
        authSentMsg.classList.add('visible');
      } else {
        // Only reached on failure -- restore the button so the user can
        // actually retry, since it was left disabled/"Sending..." above.
        authSendBtn.disabled = false;
        authSendBtn.textContent = 'Send magic link';
        if (error.status === 429) {
          setError(authError, 'Please wait a minute before requesting another link.');
        } else {
          setError(authError, 'Could not send the link — please check your connection and try again.');
        }
      }
    });

    authEmail.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') authSendBtn.click();
    });

    // detectSessionInUrl (on by default) handles the magic-link callback
    // automatically -- exchanges the code, fires this listener, and
    // cleans the URL. Also fires on manual sign-in/out, and on the
    // initial page load with an already-existing session.
    supabase.auth.onAuthStateChange((_event, session) => {
      if (session) {
        showAppScreen();
      } else {
        showAuthScreen();
      }
    });

    const addTrigger = document.getElementById('addTrigger');
    const addWrapper = document.querySelector('.add-wrapper');
    const addPopover = document.getElementById('addPopover');
    const addPopoverInner = document.querySelector('.add-popover-inner');
    const nameInput = document.getElementById('newItemName');
    const dateInput = document.getElementById('newItemDate');
    const addBtn = document.getElementById('addBtn');
    const addDateError = document.getElementById('addDateError');
    const itemList = document.getElementById('itemList');

    // The "+" trigger never moves -- opening the popover never shifts it.
    // Auto-closes after 60s of inactivity so it doesn't sit open forever
    // if you got distracted mid-entry, and closes on any click outside it
    // too (see the document click listener further down for that part).
    let collapseTimer = null;
    function closeAddPopover() {
      addPopover.classList.remove('open');
      nameInput.value = '';
      dateInput.value = '';
      setError(addDateError, '');
      clearTimeout(collapseTimer);
    }
    function resetCollapseTimer() {
      clearTimeout(collapseTimer);
      collapseTimer = setTimeout(() => {
        closeAddPopover();
        // The whole page has been idle long enough that even the OPEN
        // form gave up and closed -- the "+" trigger shouldn't then wait
        // out its own separate 30s countdown on top of that, it should
        // disappear immediately alongside the form. A deliberate close
        // (clicking "+" again, or a successful Save) is a real click and
        // already resets the 30s countdown via the document listener
        // below, so this only fires for genuine walk-away inactivity.
        hideTriggerNow();
      }, 60000);
    }
    addTrigger.addEventListener('click', () => {
      if (addPopover.classList.contains('open')) {
        closeAddPopover();
        return;
      }
      addPopover.classList.add('open');
      nameInput.focus();
      resetCollapseTimer();
    });

    // Separate from the popover's own 60s auto-collapse above: the "+"
    // trigger (and the space it occupies) collapses after 30s of no
    // clicks anywhere on the page (nothing being used) -- OR
    // immediately, the moment you click anywhere that isn't the
    // trigger/popover itself (and the popover isn't open -- see the
    // click listener below for that case), so you don't have to wait
    // it out once you're just looking at the list rather than about to
    // add something. Either way it expands back the instant anything
    // is clicked while it's hidden. The class toggles on .add-wrapper,
    // not just the trigger, so the item list rises to close the gap --
    // see the CSS comment on .add-wrapper.idle-hidden for the specific
    // trade-off this means (the trigger is no longer clickable at its
    // old spot while hidden).
    let hideTriggerTimer = null;
    function hideTriggerNow() {
      clearTimeout(hideTriggerTimer);
      addWrapper.classList.add('idle-hidden');
    }
    function scheduleTriggerHide() {
      clearTimeout(hideTriggerTimer);
      hideTriggerTimer = setTimeout(() => {
        if (!addPopover.classList.contains('open')) {
          hideTriggerNow();
        }
      }, 30000);
    }
    // Real bug found and fixed: dismissing an OPEN popover via an
    // outside click sometimes needed 2-4 clicks, even though the JS
    // itself is provably instant (confirmed via direct timing). The
    // actual cause: dismissing while the popover is open collapses TWO
    // things at once -- the popover's own shrink and the wrapper's own
    // shrink -- and the wrapper's `idle-hidden` class is set instantly
    // even though the *visual* collapse takes ~250ms. A follow-up
    // click during that visual tail (a completely natural "did that
    // work?" reaction) lands while the class already says "hidden," so
    // it gets read as "reveal it" -- undoing the dismiss. This is why
    // "+"'s own open/close toggle never has this problem: it only ever
    // touches the popover's class, never the wrapper's hidden state, so
    // there's no state to prematurely un-toggle. Two fixes, together:
    // wrapperIsCollapsing gates the "reveal" branch until the wrapper's
    // real `transitionend` fires, backed by a 350ms fallback timer as a
    // safety net -- if `transitionend` ever fails to fire for any
    // reason (an interrupted transition, a backgrounded tab pausing
    // rendering, a browser quirk), the fallback guarantees the gate
    // clears on its own rather than staying stuck forever, which would
    // be a worse bug than the one being fixed. And the popover is
    // snapped shut instantly (no separate transition of its own) when
    // dismissed this way, since the wrapper's own single collapse is
    // about to hide it anyway -- one clean motion instead of two
    // overlapping ones. Neither fix touches the "+" trigger's own click
    // behavior, Save/Delete, or the simple bare-hide case (popover
    // never opened) at all -- confirmed unchanged by diff.
    let wrapperIsCollapsing = false;
    let wrapperCollapseFallbackTimer = null;
    function clearWrapperCollapsingGate() {
      wrapperIsCollapsing = false;
      clearTimeout(wrapperCollapseFallbackTimer);
    }
    addWrapper.addEventListener('transitionend', (e) => {
      if (e.target === addWrapper && e.propertyName === 'max-height') {
        clearWrapperCollapsingGate();
      }
    });

    // Listens on `mousedown`, not `click` -- deliberately. A `click`
    // event only fires if the mouse goes down AND up on (near) the
    // same spot; any slight drift between the two (easy on a trackpad,
    // or just a big open background with lots of room to drift) makes
    // the browser silently fire no click at all, which reads exactly
    // like "I clicked and nothing happened." `mousedown` fires the
    // instant the button is pressed, with no such requirement -- the
    // standard, more robust choice for "click outside to dismiss"
    // interactions generally, not specific to this bug. The "+"
    // trigger's own handler (and Save/Delete/inputs) still listen on
    // `click` as normal -- only this outside-dismiss listener changed.
    //
    // Real bug found and fixed 2026-09-02, reported live as "close to
    // the plus button it doesn't disappear, have to click multiple
    // times": this checked `addWrapper.contains(e.target)` -- but
    // .add-wrapper is a bare block element with no width set, so it
    // stretches to the FULL container width, well past the visible bar
    // on either side (confirmed by direct measurement doing the
    // identical fix on Investments' own copy of this exact mechanism
    // the same day -- see that file's own comment on this same bug for
    // the full write-up). Any click landing in that invisible margin
    // read as "inside," so it only reset the idle timer instead of
    // dismissing. Scoped to what's actually visible instead: the
    // trigger circle, or the popover's own real card
    // (.add-popover-inner, which has a background/border painted right
    // up to its true edges here, unlike .add-wrapper).
    document.addEventListener('mousedown', (e) => {
      const clickedInsideWrapper = addTrigger.contains(e.target) || addPopoverInner.contains(e.target);

      if (addWrapper.classList.contains('idle-hidden')) {
        // Currently hidden -- any click anywhere reveals it, UNLESS
        // it's still visually mid-collapse from a dismiss a moment
        // ago (see wrapperIsCollapsing above) -- a click during that
        // window is almost always someone reacting to "did that work?"
        // not a genuine request to bring it back.
        if (wrapperIsCollapsing) return;
        addWrapper.classList.remove('idle-hidden');
        scheduleTriggerHide();
        return;
      }

      if (clickedInsideWrapper) {
        // Click landed on the trigger or inside the open popover itself
        // (including the empty space between fields and Save inside the
        // row -- still a descendant of the wrapper) -- their own
        // handlers (addTrigger's toggle, Save, the inputs) already
        // manage what happens; just keep the 30s timer fresh.
        scheduleTriggerHide();
        return;
      }

      // Click landed outside the wrapper entirely -- close the popover
      // (if it was open) AND hide the "+" circle together, in this one
      // click, instantly.
      if (addPopover.classList.contains('open')) {
        // Snap shut instantly, no transition of its own -- the
        // wrapper's own collapse (below) is about to hide it anyway.
        addPopover.style.transition = 'none';
        closeAddPopover();
        void addPopover.offsetHeight; // force the no-transition style to actually apply
        addPopover.style.transition = '';
        // Only gate the next reveal-click here, in the compound
        // (popover-was-open) case -- this is the one with the longer,
        // more complex visual tail that caused real confusion. The
        // simple bare-hide case (popover never opened) stays exactly
        // as instant and ungated as it was already proven to be --
        // confirmed via a 6-rapid-click test earlier this session, and
        // deliberately not touched here.
        wrapperIsCollapsing = true;
        clearTimeout(wrapperCollapseFallbackTimer);
        wrapperCollapseFallbackTimer = setTimeout(clearWrapperCollapsingGate, 350);
      }
      hideTriggerNow();
    });
    scheduleTriggerHide();

    // Toggles the .visible class alongside the text, so an empty error
    // div takes up zero space (display:none) instead of quietly
    // reserving its own line-height + margin-top even with nothing in it.
    function setError(el, message) {
      el.textContent = message;
      el.classList.toggle('visible', !!message);
    }

    // Hard-coded DD/MM/YYYY entry, same pattern as the VAT/sort-code fields
    // elsewhere -- no native date picker at all. Auto-formats as you type
    // (digits only, slashes inserted automatically), and only accepts a
    // genuinely valid calendar date on submit.
    function formatDateInput(raw) {
      const digits = raw.replace(/\D/g, '').slice(0, 8); // DDMMYYYY
      if (digits.length > 4) return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
      if (digits.length > 2) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
      return digits;
    }
    function attachDateFormatting(el) {
      el.addEventListener('input', () => {
        el.value = formatDateInput(el.value);
      });
    }
    attachDateFormatting(dateInput);

    // Year must be exactly 4 digits starting with "20" (2000-2099) --
    // matches the explicit rule given, not an arbitrary +/- window.
    // Returns the ISO (YYYY-MM-DD) string for storage, or null if invalid --
    // also rejects real calendar impossibilities like 30/02, not just
    // out-of-range day/month numbers.
    function parseDDMMYYYY(str) {
      const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(str);
      if (!m) return null;
      const day = Number(m[1]);
      const month = Number(m[2]);
      const yearStr = m[3];
      if (month < 1 || month > 12) return null;
      if (day < 1 || day > 31) return null;
      if (!/^20\d{2}$/.test(yearStr)) return null;
      const year = Number(yearStr);
      const d = new Date(year, month - 1, day);
      if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return null;
      return `${yearStr}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }
    function isoToDDMMYYYY(iso) {
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }

    nameInput.addEventListener('input', resetCollapseTimer);
    dateInput.addEventListener('input', resetCollapseTimer);
    nameInput.addEventListener('focus', resetCollapseTimer);
    dateInput.addEventListener('focus', resetCollapseTimer);

    // Enter moves you straight to the next field, and submits from the
    // last one -- so filling in a new item never requires manually
    // reaching for the mouse/trackpad.
    nameInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      dateInput.focus();
    });
    dateInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      addBtn.click();
    });

    function daysUntil(dateStr) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(dateStr + 'T00:00:00');
      return Math.round((target - today) / 86400000);
    }

    function colorFor(days) {
      if (days <= 7) return 'var(--red)';
      if (days <= 30) return 'var(--orange)';
      return 'var(--green)';
    }

    function countdownText(days) {
      if (days < 0) return `${Math.abs(days)} day${Math.abs(days) === 1 ? '' : 's'} overdue`;
      if (days === 0) return 'Due today';
      return `${days} day${days === 1 ? '' : 's'} to go`;
    }

    // Newest-added first, not soonest-expiring first -- a just-added item
    // always lands as the very first row, right under "+", and stays there
    // permanently (editing it later doesn't move it, since only created_at
    // determines position, never updated_at).
    async function loadItems() {
      const { data, error } = await supabase
        .from('renewal_items')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        itemList.innerHTML = '<div class="empty-state">Could not load renewals. Please refresh.</div>';
        return;
      }
      renderItems(data);
    }

    function renderItems(items) {
      itemList.innerHTML = '';
      if (!items.length) {
        itemList.innerHTML = '<div class="empty-state">Nothing tracked yet — add your first renewal above.</div>';
        return;
      }
      for (const item of items) {
        itemList.append(buildItemRow(item));
      }
    }

    // Builds one row in its normal (non-editing) view. Factored out of
    // renderItems so a single Save/Delete can rebuild or remove just its
    // own row afterward, instead of the whole list having to reload --
    // that reload was exactly what collapsed every OTHER open edit panel
    // back to normal, even ones you hadn't touched.
    function buildItemRow(item) {
      const days = daysUntil(item.expiry_date);
      const row = document.createElement('div');
      row.className = 'item';
      row.style.setProperty('--item-color', colorFor(days));
      // mouseenter/mouseleave (unlike mouseover/mouseout) only fire once
      // for the whole row, not again for every child crossed -- so this
      // reliably stays "hovered" the entire time the cursor is anywhere
      // inside the row.
      row.addEventListener('mouseenter', () => row.classList.add('row-hovered'));
      row.addEventListener('mouseleave', () => row.classList.remove('row-hovered'));

      const name = document.createElement('div');
      name.className = 'item-name';
      name.textContent = item.item_name;

      const countdown = document.createElement('div');
      countdown.className = 'item-countdown';
      countdown.textContent = countdownText(days);

      // The whole row is the trigger now -- no separate "Update" button.
      // Removes its own listener the instant it fires (before
      // showEditPanel does anything else), so a click that bubbles up
      // from inside the newly-built edit panel (an input, Save, Delete)
      // can never re-open edit mode on a row that's already in it.
      //
      // Listens on `mousedown`, not `click` -- real bug found: a click
      // on a row also reaches the document-level mousedown listener
      // (see below), which can reveal or collapse the "+" wrapper --
      // an animated height change that shifts the whole item list up
      // or down while the mouse button is still down. By the time
      // `click` would have fired (on mouse-up), the row has physically
      // moved out from under the cursor, so the release lands
      // somewhere else and edit mode never opens. Using `mousedown`
      // here resolves everything in the same synchronous pass, before
      // any layout shift has a chance to happen -- same fix, same
      // reasoning as the outside-dismiss listener, just applied to
      // this row-level trigger instead. The outside-dismiss listener
      // itself is untouched.
      function openEdit() {
        row.removeEventListener('mousedown', openEdit);
        showEditPanel(row, item, name, countdown);
      }
      row.addEventListener('mousedown', openEdit);

      row.append(name, countdown);
      return row;
    }

    // Single edit surface for a row -- name, date, Save, and Delete all
    // together, opened by clicking anywhere on the row. Delete here is a
    // direct action (no separate arm/confirm step): getting here already
    // required the deliberate click to enter edit mode, so that's the
    // real gate.
    function showEditPanel(row, item, name, countdown) {
      const panel = document.createElement('div');
      panel.className = 'edit-panel';

      const nameEl = document.createElement('input');
      nameEl.type = 'text';
      nameEl.id = 'editName';
      nameEl.value = item.item_name;
      nameEl.autocomplete = 'off';

      const dateEl = document.createElement('input');
      dateEl.type = 'text';
      dateEl.id = 'editDate';
      dateEl.inputMode = 'numeric';
      dateEl.placeholder = 'DD/MM/YYYY';
      dateEl.maxLength = 10;
      dateEl.autocomplete = 'off';
      dateEl.value = isoToDDMMYYYY(item.expiry_date);
      attachDateFormatting(dateEl);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'edit-save-btn';
      saveBtn.textContent = 'Save';

      // Same Enter-to-advance behaviour as the add form.
      nameEl.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        dateEl.focus();
      });
      dateEl.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        saveBtn.click();
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'edit-delete-btn';
      deleteBtn.textContent = 'Delete';

      const errorEl = document.createElement('div');
      errorEl.className = 'date-error';

      // mousedown, not click -- same reasoning as the row's own
      // openEdit trigger above: Save/Delete live inside an .item row,
      // outside .add-wrapper, so a click here also reaches the
      // document-level mousedown listener, which can hide the "+"
      // circle (an animated height change) and shift this row -- and
      // therefore this button -- out from under the cursor before a
      // `click` would have fired on mouse-up. mousedown resolves the
      // real action in the same synchronous pass, immune to that.
      saveBtn.addEventListener('mousedown', async () => {
        setError(errorEl, '');
        const newName = nameEl.value.trim();
        if (!newName) {
          setError(errorEl, 'Name is required.');
          return;
        }
        const isoDate = parseDDMMYYYY(dateEl.value);
        if (!isoDate) {
          setError(errorEl, 'Please check your date.');
          return;
        }
        const { error } = await supabase
          .from('renewal_items')
          .update({ item_name: newName, expiry_date: isoDate, updated_at: new Date().toISOString(), notified_at: null })
          .eq('id', item.id);
        if (!error) {
          // Rebuild only THIS row back to its normal view -- every other
          // row keeps whatever state it was already in (open or not).
          const updatedItem = { ...item, item_name: newName, expiry_date: isoDate };
          row.replaceWith(buildItemRow(updatedItem));
        } else {
          setError(errorEl, 'Could not save — please check your connection and try again.');
        }
      });

      // mousedown, not click -- same reasoning as Save just above.
      deleteBtn.addEventListener('mousedown', async () => {
        setError(errorEl, '');
        const { error } = await supabase.from('renewal_items').delete().eq('id', item.id);
        if (!error) {
          // Remove only THIS row -- every other open edit panel is
          // untouched, same reasoning as Save above.
          row.remove();
          if (!itemList.children.length) {
            itemList.innerHTML = '<div class="empty-state">Nothing tracked yet — add your first renewal above.</div>';
          }
        } else {
          setError(errorEl, 'Could not delete — please check your connection and try again.');
        }
      });

      const fields = document.createElement('div');
      fields.className = 'edit-fields';
      fields.append(nameEl, dateEl);

      const actions = document.createElement('div');
      actions.className = 'edit-actions';
      actions.append(saveBtn, deleteBtn);

      const editRow = document.createElement('div');
      editRow.className = 'edit-row';
      editRow.append(fields, actions);

      panel.append(editRow, errorEl);
      row.replaceChild(panel, countdown);
      name.remove();
    }

    addBtn.addEventListener('click', async () => {
      setError(addDateError, '');
      const name = nameInput.value.trim();
      // Was a silent no-op before (nothing happened at all if either
      // field was left blank) -- now matches the edit panel's own
      // validation exactly, same wording, same red .date-error style.
      if (!name) {
        setError(addDateError, 'Name is required.');
        return;
      }
      const isoDate = parseDDMMYYYY(dateInput.value);
      if (!isoDate) {
        setError(addDateError, 'Please check your date.');
        return;
      }

      const { data, error } = await supabase
        .from('renewal_items')
        .insert({ item_name: name, expiry_date: isoDate })
        .select()
        .single();

      if (!error && data) {
        clearTimeout(collapseTimer);
        closeAddPopover();
        // Prepend just the new row -- doesn't disturb any edit panel
        // already open elsewhere in the list, same reasoning as Save/Delete.
        const emptyState = itemList.querySelector('.empty-state');
        if (emptyState) emptyState.remove();
        itemList.prepend(buildItemRow(data));
      } else {
        setError(addDateError, 'Could not save — please check your connection and try again.');
      }
    });

    // No unconditional loadItems() here -- it's called from
    // showAppScreen() once onAuthStateChange confirms a real session,
    // never before. Nothing fetches or renders while signed out.
  </script>
  <script>
    // Registered purely so the browser offers "Install" -- see sw.js for
    // why it deliberately does no caching.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Renewals</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="theme-color" content="#1E2633" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Same locked design tokens as the rest of PrimeLevel's dashboard tools. */
  :root {
    --navy: #1E2633;
    --white: #F9F9FA;
    --gold: #B29B68;
    --input-bg: #2A3441;
    --placeholder: #8A93A3;
    --border: #3A4453;
    --green: #4CAF7D;
    --orange: #D9A441;
    --red: #E45858;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--navy);
    font-family: 'Montserrat', 'Montserrat Fallback', sans-serif;
    min-height: 100%;
  }
  /* ONE screen. Renewals is part of the Masterboard (owner, 2026-10-01:
     "no sign-in box in Renewals… you won't be able to access Renewals
     unless you go through the Masterboard"): signing in happens once, on
     the Masterboard front door; anyone not signed in as the owner is sent
     there (see route() in the script). max-width 700px (owner: item rows a
     bit wider), centred. */
  .container {
    max-width: 700px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  #appContainer {
    padding-top: 87px; /* was 100 (owner 2026-09-28): the "Renewals" letters start 13px below their box top, so they land exactly 100px from the page top BY EYE, like every Masterboard page */
  }
  /* The family title: gold, bold, 50px, centred (owner 2026-09-28). */
  #appContainer h1 {
    color: var(--gold);
    font-weight: 700;
    font-size: 50px;
    line-height: 65px; /* same title line as Insider Edge, Inbox Report and Investments */
    margin: 0;
    text-align: center;
  }

  /* Phone titles: the same steps as every Masterboard page (44px on
     phones, 38px on the smallest), so the whole family behaves the same. */
  @media (max-width: 720px) {
    #appContainer h1 {
      font-size: 44px;
      line-height: normal;
    }
  }
  @media (max-width: 359px) {
    #appContainer h1 {
      font-size: 38px;
    }
  }

  /* Clicking the "+" opens the add-popover in normal page flow, right
     underneath -- it pushes the list down rather than floating over it,
     so it never overlaps the first item. Same resting/hover color
     language as Save/Delete (below) -- transparent + white outline
     at rest, full white-fill/navy-text swap on hover -- so they all
     read as genuinely identical, not just similar. */
  /* margin-top: exact 100px title-to-circle gap (h1's own margin was
     zeroed out for this screen -- see #appContainer h1 above -- so
     this is the only thing creating that gap now). margin-top NEVER
     changes, idle-hidden or not -- title-to-wrapper is always 100px.
     margin-bottom + max-height: exact 100px circle-to-list gap when
     visible, collapsing to 0 when idle-hidden (see .add-wrapper.
     idle-hidden below) so the list rises to sit exactly 100px below
     the title with nothing in between, not a leftover empty 256px gap
     where an invisible circle used to be. Paired with .empty-state's
     own top padding being removed below, so the visible gap to
     "Nothing tracked yet..." (or the first real item) is exactly
     this 100px, not 100 + extra padding on top of it.
     260px max-height (visible state) is a generous fixed value --
     comfortably above the tallest real content (circle 56px + open
     popover's own 12px margin + 160px max-height = 228px) -- same
     "hard clip between two fixed numbers" collapse pattern used for
     .add-popover below, not the content-based grid-rows trick that's
     proven unreliable elsewhere in this file. */
  /* padding-top/bottom: 2px each -- real bug found and fixed: the
     "+" circle's hover pop (scale(1.03)) grows the button by ~0.84px
     on each side, but this wrapper's overflow:hidden box was sized
     EXACTLY to the circle's own 56px height with zero headroom, so
     the top and bottom of the circle were genuinely being clipped on
     hover (confirmed via the CSS math -- overflow:hidden + a
     content-height-only box + any transform growth at all = clipping,
     deterministically, not something that needed visual reproduction).
     2px of padding each side gives real headroom (more than double
     the ~0.84px actually needed). Margin-top/margin-bottom were left
     untouched by this fix (margin-top is now 83px: title -> circle =
     100px by eye since 2026-09-28) so the LOCKED
     collapsed-state gap (title->list == 100px when idle-hidden) stays
     exactly 100px -- max-height:0 collapses this padding away to
     nothing regardless of its value, same as it already did for the
     circle's own content height. The only side-effect is the VISIBLE
     state's title->circle and circle->list gaps growing from the
     previously-locked 100px to 102px each -- a small, disclosed
     trade-off, not a silent drift. */
  .add-wrapper {
    margin-top: 83px; /* was 100 (owner 2026-09-28): title letters' baseline -> "+" circle edge = 100px BY EYE (15px of title box below the baseline + 83 + this wrapper's 2px padding-top) */
    margin-bottom: 98px; /* was 100 (owner 2026-10-06: "one hundred all the way"): circle edge -> first renewal card = 100px BY EYE (98 + this wrapper's 2px padding-bottom), the same as the title -> circle above it and as Investments; the open "+" panel -> list gets the same 100 */
    padding-top: 2px;
    padding-bottom: 2px;
    max-height: 260px;
    overflow: hidden;
    transition: max-height 0.25s ease, margin-top 0.25s ease, margin-bottom 0.25s ease;
  }
  /* Collapses the whole wrapper (circle + its own margins) down to
     nothing, so .itemList rises to close the gap -- an explicit,
     deliberate reversal of the "reserved in layout, never shifts"
     behavior below. Trade-off, stated plainly: the trigger is no
     longer clickable at its old screen position while hidden (there's
     nothing there anymore once the wrapper collapses) -- clicking
     anywhere still reveals it via the document listener below, same
     as before, it just now takes a second click to actually use it
     rather than reveal-and-activate in one. Guarded in JS to never
     apply while the popover is open, so an open popover can never be
     stranded with no visible trigger to close it via. */
  .add-wrapper.idle-hidden {
    max-height: 0;
    margin-top: 81px; /* owner 2026-09-28: with the circle hidden, title letters -> first renewal card = 100px BY EYE (15 below the baseline + 81 + the 4px of padding a collapsed wrapper keeps) */
    margin-bottom: 0;
  }
  /* 100 by eye on phones too (owner, 2026-10-01: "100 everywhere"): page
     top -> title letters, title letters -> the "+" circle or (circle
     hidden) the first renewal card. The phone title is smaller with a
     normal line, so the space below its letters differs. Placed here,
     after the rules above, so it wins over them. */
  @media (max-width: 720px) {
    #appContainer { padding-top: 90px; }
    .add-wrapper { margin-top: 87px; }
    .add-wrapper.idle-hidden { margin-top: 85px; }
  }
  @media (max-width: 359px) {
    #appContainer { padding-top: 91px; }
    .add-wrapper { margin-top: 88px; }
    .add-wrapper.idle-hidden { margin-top: 86px; }
  }
  /* Size scaled by the same ratio the title grew (32px -> 50px =
     x1.5625): 36px -> 56px, and the "+" glyph's own font-size 20px ->
     31px to match, staying visually proportional rather than a bigger
     circle with the same small glyph inside it. */
  .add-trigger {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    /* 1px, not 0.5px (owner, 2026-10-06: "half of the circle has gone" on
       his iPhone): Safari draws a real half-pixel line there, and a line
       that thin fades away wherever the curve falls between the screen's
       dots (his screenshot: the left side nearly invisible). Computers
       already drew the 0.5px line one full pixel thick, so they look the
       same; the 45% strength below keeps the circle as quiet as before.
       Same 1px as the Save / Delete buttons. */
    border: 1px solid var(--white);
    background: transparent;
    color: var(--white);
    font-size: 31px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    opacity: 0.45;
    user-select: none;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  /* Highlighted (white) = ITS CARD IS OPEN (owner, 2026-10-09: "the button
     is attached to the box… I want the highlighted circle all the time"),
     on every device, wherever the last tap landed; and, where a real
     pointer hovers (a mouse), while pointing at it. A finger has no hover:
     on a phone the hover look used to stick to whatever was tapped last,
     so the circle was white or not depending on where you tapped. Same in
     Investments.
     Scale 3%, not the 1.5% used on the item row -- at this circle's small
     56px size, 1.5% only moved ~0.8px, imperceptible. 3% reads as an
     actual pop here. Deliberately different from the row's value, not
     an inconsistency -- see the item-row comment for why it stays at
     1.5%. */
  .add-wrapper:has(.add-popover.open) .add-trigger {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    transform: scale(1.03);
  }
  @media (hover: hover) {
    .add-trigger:hover {
      opacity: 1;
      background: var(--white);
      color: var(--navy);
      transform: scale(1.03);
    }
  }
  .add-trigger:active { transform: scale(0.94); }
  /* Idle auto-hide: fades out after 30s of no clicks anywhere on the
     page, reappears on the next click. The class toggles on
     .add-wrapper (see above), which also collapses the layout around
     it -- so this is just the opacity half of that same state, not an
     independent toggle. (Previously this deliberately did NOT shift
     layout, so an invisible trigger stayed clickable in its exact old
     spot -- one click both revealed and activated it. That trick is
     gone now that the wrapper collapses on hide: reveal and click are
     two separate actions again, a deliberate trade-off for the list
     rising to close the gap, per explicit request.) */
  .add-wrapper.idle-hidden .add-trigger {
    opacity: 0;
  }

  /* max-height 0 -> generous-fixed-value trick: a simpler, more reliable
     collapse animation than the grid-rows 0fr/1fr approach used earlier.
     That approach broke when padding/border also needed to animate (the
     grid's "1fr" target depends on the content's current padded size, so
     animating both at once creates a circular dependency that made the
     open state randomly fail to render at all -- found via direct
     testing, not a hypothetical). max-height has no such interaction:
     it's just a hard clip between two fixed numbers, so padding/border
     on the inner card can stay constant and still collapse to a true 0
     when closed (clipped by overflow:hidden here, same as before). 160px
     is comfortably above the tallest real content (name/date row + the
     error line), so it never visibly truncates. */
  .add-popover {
    max-height: 0;
    margin-top: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-height 0.25s ease, margin-top 0.25s ease, opacity 0.2s ease;
  }
  .add-popover.open {
    max-height: 160px;
    margin-top: 12px;
    opacity: 1;
  }
  .add-popover-inner {
    display: flex;
    flex-direction: column;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* Same layout language as .edit-row: fixed-width fields, Save sits
     flush right via space-between. With only one button (no Delete),
     this form's gap is naturally much wider than the edit row's --
     276 (name) + 8 (gap) + 130 (date) + 90 (Save) = 504 of the 620px
     row, leaving 116px, not the same "16px" the edit row lands on.
     That's expected, not a bug: fewer buttons means more leftover
     space, not an equal gap by design. (An earlier version of this
     comment claimed a matching 16px gap here -- that was never
     actually true once measured; corrected.) */
  /* space-between, not flex-grow -- so the name field can stay a FIXED
     width shared with #editName below, genuinely pixel-identical in
     both forms regardless of how many buttons follow. (flex-grow was
     tried first, but grow-to-fill produces a WIDER field here than in
     the edit panel, since this form has one fewer button and therefore
     more room to grow into -- found via direct measurement: 356px here
     vs 276px there. Fixed width fixes that for real.) */
  .add-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .add-fields {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  /* Shared with .edit-panel input below -- genuinely the same color,
     border, radius, font-size and padding in both forms, not just a
     similarly-styled input that happened to look close. */
  /* font-size matches Save/Delete's own 15px (was 13px) -- with the
     same 6px vertical padding both already shared, matching font-size
     is what makes the input and button boxes come out the same total
     height, confirmed by direct measurement rather than assumed. */
  .add-popover input,
  .edit-panel input {
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--white);
    font-family: 'Montserrat', 'Montserrat Fallback', sans-serif;
    font-size: 15px;
    padding: 6px 8px;
    outline: none;
  }
  .add-popover input::placeholder { color: var(--placeholder); }
  /* No border-color change on focus -- the blinking text cursor is the
     only focus signal now, border stays exactly as it is at rest.
     outline:none still needed to suppress the browser's own default
     blue focus ring. */
  input:focus {
    outline: none;
  }
  /* Fixed width, shared with #editName below -- genuinely the same
     pixel size in both forms, not just a similar-looking one. 276px is
     what the edit panel's row math already required (see .edit-fields
     comment); reusing that exact value here, rather than letting this
     field size itself independently, is what makes them identical. */
  #newItemName, #editName { flex: 0 0 auto; width: 276px; }
  /* 130px, not the earlier 110px -- measured live: the "DD/MM/YYYY"
     placeholder needs ~121px (text + padding + border) at this font,
     110px clipped the final "Y". 130px gives real breathing room, not
     just the bare minimum. text-align:center (not the default left)
     because the extra ~8.6px of that breathing room would otherwise
     sit entirely after the "Y" -- left-aligned text plus equal CSS
     padding does NOT produce equal visual gaps once the field is
     wider than the text itself. Centering splits it evenly instead. */
  #newItemDate { flex: 0 0 auto; width: 130px; text-align: center; }
  /* Hidden by default -- an empty error div still reserves its own
     line-height plus margin-top even with no text in it, which was
     silently making the bottom padding look bigger than the top (23px
     vs 17px, found via direct measurement). Only takes up space once
     there's an actual message to show. */
  .date-error {
    display: none;
    color: var(--red);
    /* 13px -> 15px, margin-top 6px -> 4px, centered added, 2026-09-02 --
       explicit request to match Investments' own add/edit-panel error
       text exactly (.add-error / .holding-edit-error there: 15px, red,
       centered, margin-top:4px), since that styling was itself copied
       FROM here originally -- brought back in sync. */
    font-size: 15px;
    text-align: center;
    margin-top: 4px;
    flex-basis: 100%;
  }
  .date-error.visible {
    display: block;
  }
  /* Now genuinely identical to .edit-save-btn / .edit-delete-btn --
     same 90x33 box (widened from 72x30 alongside the 13px->15px font
     bump -- 72px left "Update"/"Delete" text 1px from the border on
     one side, 13px on the other; 90px gives a genuinely symmetric
     16px/16px margin, confirmed by direct measurement), same
     resting/hover color swap -- not just similarly sized and a
     different gold-fill language. Border is a full 1px here, not the
     0.5px used elsewhere (the rows) -- this button sits
     directly next to a 1px-bordered input and needs to match its
     height exactly; 0.5px is subject to inconsistent sub-pixel
     rounding across devices (confirmed: renders as a full 1px on one
     display, visibly thinner on another), so relying on it to happen
     to round up to the same value as the input's explicit 1px is
     fragile. A matching explicit 1px on both removes that risk
     entirely rather than hoping the rounding lines up. */
  .add-save-btn {
    flex: 0 0 auto;
    width: 90px;
    text-align: center;
    background: transparent;
    border: 1px solid var(--white);
    color: var(--white);
    font-family: 'Montserrat', 'Montserrat Fallback', sans-serif;
    font-weight: 700;
    font-size: 15px;
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  .add-save-btn:hover {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    /* 2%, not 3% -- explicitly dialed back down from the row/circle's
       language: at this button's size the 3% pop felt like too much,
       per direct user feedback, while the "+" circle stays at 3%.
       Still matches .edit-save-btn/.edit-delete-btn exactly (this
       button is genuinely identical to those in every other respect),
       so its hover pop stays identical to theirs too. */
    transform: scale(1.02);
  }
  .add-save-btn:active {
    transform: scale(0.96);
  }

  /* Item list -- urgency is shown purely through the countdown text color
     (see .item-countdown below), not a separate border stripe -- one clean
     signal, not two redundant ones. */
  /* height: explicit 70px (was an incidental 64px, produced by padding
     + line-height, not a chosen value) -- content stays vertically
     centered via align-items:center regardless. */
  /* user-select:none -- the row is a click target, not readable text,
     so any tiny mouse drift during a click shouldn't trigger the
     browser's native text-selection (the blue highlight). Real bug
     caught via screenshot: clicking around highlighted "House" and
     "529 days to go" like selected text, since nothing was stopping
     the browser's default selection behavior on plain text content. */
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    height: 70px;
    padding: 16px 20px;
    border-radius: 10px;
    border: 0.5px solid var(--border);
    background: var(--input-bg);
    margin-bottom: 15px;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.15s ease, transform 0.1s ease;
  }
  /* Hovering the row frames all four sides in white (same thin 1px
     thickness, plain border-color swap, no box-shadow) -- the only
     affordance now that there's no separate "Update" button; the whole
     row itself opens edit mode on click (see the JS below). Driven by
     a JS-toggled class (mouseenter/mouseleave), not CSS :hover, kept
     from when a child button needed the highlight to survive being
     hovered directly -- no longer strictly necessary now that the row
     has no interactive children in its normal view, but harmless to
     leave as-is. Also gets the same scale(1.015) "pop" as every other
     hoverable control on this page (+ circle, Save/Delete, add-form
     Save) -- one consistent hover language across the whole app. */
  .item.row-hovered {
    border-color: var(--white);
    transform: scale(1.015);
  }
  .item-name {
    color: var(--white);
    font-weight: 700;
    font-size: 20px;
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item-countdown {
    color: var(--item-color);
    font-weight: 700;
    font-size: 20px;
    flex: 0 0 auto;
    white-space: nowrap;
  }
  /* Edit panel -- opens in place of the countdown once the row is clicked.
     Two groups (fields, actions) with the exact same internal gap, pushed
     to opposite ends -- so Save/Delete land flush against the row's right
     edge, same as the Update button does on every other row, rather than
     just trailing wherever the fixed-width fields happen to end. */
  .edit-panel {
    display: flex;
    flex-direction: column;
    flex: 1;
  }
  /* space-between, not flex-grow -- with a fixed-width name field
     (shared with #newItemName above), space-between places whatever's
     left as one clean gap between the two groups. Measured live at the
     current widths (620px row content): 276 (name) + 8 (gap) + 130
     (date) + 188 (90 Save + 8 + 90 Delete) = 602, leaving an 18px gap.
     (Comment previously cited stale 110px-date/562px-row numbers from
     an earlier round of width changes -- corrected here to the real,
     measured values, not re-derived from memory.) */
  .edit-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  /* gap: 6px, not the matching 8px used everywhere else (.edit-actions,
     .add-fields) -- a deliberate, small optical compensation, not a
     real spacing bug. The Name<->Date gap here uses the input fields'
     own low-contrast dark border (blends into the background), while
     the Save<->Delete gap next to it uses the buttons' bright white
     border -- same literal 8px in both, confirmed by direct
     measurement, but the high-contrast white border visually "eats
     into" its gap more, making it read as tighter. Narrowing this gap
     is a targeted nudge to compensate for that specific perceptual
     difference, per explicit user request (first tried 7px, then
     dialed down further to 6px) -- not derived from any formula
     (optical contrast effects don't have one), just a minimal,
     easily-reversible try. .add-fields (the add-form's own Name<->Date
     gap) is untouched at 8px -- it never faces this same issue since
     the add-form only has one button, no adjacent white border to
     compare against. */
  .edit-fields {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .edit-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #editDate { flex: 0 0 auto; width: 130px; text-align: center; }
  /* border-width: full 1px, not the 0.5px used elsewhere -- same
     reasoning as .add-save-btn above: this button sits directly next
     to the 1px-bordered Name/Date inputs and needs to match their
     height exactly, which a sub-pixel border can't reliably guarantee
     across different screens. */
  .edit-panel button {
    border-style: solid;
    border-width: 1px;
    border-radius: 6px;
    font-family: 'Montserrat', 'Montserrat Fallback', sans-serif;
    font-weight: 700;
    font-size: 15px;
    padding: 6px 12px;
    cursor: pointer;
    width: 90px;
    text-align: center;
    opacity: 0.45;
    transition: opacity 0.15s ease, transform 0.1s ease;
  }
  /* Save and Delete match the add-form's own Save button exactly --
     same resting style (transparent, white outline, dimmed) and same
     hover swap (white fill, navy text). Still visually identical to
     EACH OTHER (only the label differs). */
  .edit-save-btn,
  .edit-delete-btn {
    background: transparent;
    border-color: var(--white);
    color: var(--white);
  }
  .edit-save-btn:hover,
  .edit-delete-btn:hover {
    opacity: 1;
    background: var(--white);
    color: var(--navy);
    /* 2%, not the "+" circle's 3% -- explicitly dialed back down per
       direct user feedback (3% felt like too much on Save/Delete
       specifically). Still bigger than the item row's
       1.5% (a % scale is relative to element size, and these 90px
       buttons need more than 1.5% to read as a pop at all), just not
       as much as the circle. */
    transform: scale(1.02);
  }
  .edit-save-btn:active,
  .edit-delete-btn:active {
    transform: scale(0.96);
  }

  /* Top padding removed -- the 100px gap above this text now comes
     entirely from .add-wrapper's own margin-bottom, so the two don't
     stack into 140px. Bottom padding (40px) left exactly as it was --
     that wasn't part of what was asked to change.
     margin-top -4px (owner, 2026-10-06: "one hundred all the way"): the
     letters start 4px below the top of their own line, so without it the
     circle -> "Nothing tracked yet" gap measured 106 by eye (and 104 with
     the circle hidden, from the title). With it the LETTERS sit exactly
     100 below the circle, the open "+" panel and (circle hidden) the
     title, like every other 100 on these pages. */
  .empty-state {
    color: var(--placeholder);
    font-size: 20px;
    text-align: center;
    padding: 0 0 40px;
    margin-top: -4px;
  }

  /* RESPONSIVE (owner, 2026-09-28: every page must fit every device).
     The add form and the edit row are one fixed 620px row (276 name +
     130 date + 90 Save [+ 90 Delete]), which only fits from ~700px wide.
     Below that the card clipped it: on a 375px phone the date field was
     half hidden and Save/Delete were invisible. On phones they now stack:
     name, date, then a full-width Save (add form) or Save + Delete side
     by side (edit row), and a row being edited grows to fit. Tablets and
     desktop keep the one-row layout exactly as before. */
  @media (max-width: 699px) {
    .add-row,
    .edit-row {
      flex-direction: column;
      align-items: stretch;

      // somewhere else and edit mode never opens. Using `mousedown`
      // here resolves everything in the same synchronous pass, before
      // any layout shift has a chance to happen -- same fix, same
      // reasoning as the outside-dismiss listener, just applied to
      // this row-level trigger instead. The outside-dismiss listener
      // itself is untouched.
      function openEdit() {
        row.removeEventListener('mousedown', openEdit);
        showEditPanel(row, item, name, countdown);
      }
      row.addEventListener('mousedown', openEdit);

      row.append(name, countdown);
      return row;
    }

    // Single edit surface for a row -- name, date, Save, and Delete all
    // together, opened by clicking anywhere on the row. Delete here is a
    // direct action (no separate arm/confirm step): getting here already
    // required the deliberate click to enter edit mode, so that's the
    // real gate.
    function showEditPanel(row, item, name, countdown) {
      const panel = document.createElement('div');
      panel.className = 'edit-panel';

      const nameEl = document.createElement('input');
      nameEl.type = 'text';
      nameEl.id = 'editName';
      nameEl.value = item.item_name;
      nameEl.autocomplete = 'off';

      const dateEl = document.createElement('input');
      dateEl.type = 'text';
      dateEl.id = 'editDate';
      dateEl.inputMode = 'numeric';
      dateEl.placeholder = 'DD/MM/YYYY';
      dateEl.maxLength = 10;
      dateEl.autocomplete = 'off';
      dateEl.value = isoToDDMMYYYY(item.expiry_date);
      attachDateFormatting(dateEl);

      const saveBtn = document.createElement('button');
      saveBtn.className = 'edit-save-btn';
      saveBtn.textContent = 'Save';

      // Same Enter-to-advance behaviour as the add form.
      nameEl.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        dateEl.focus();
      });
      dateEl.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        saveBtn.click();
      });

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'edit-delete-btn';
      deleteBtn.textContent = 'Delete';

      const errorEl = document.createElement('div');
      errorEl.className = 'date-error';

      // mousedown, not click -- same reasoning as the row's own
      // openEdit trigger above: Save/Delete live inside an .item row,
      // outside .add-wrapper, so a click here also reaches the
      // document-level mousedown listener, which can hide the "+"
      // circle (an animated height change) and shift this row -- and
      // therefore this button -- out from under the cursor before a
      // `click` would have fired on mouse-up. mousedown resolves the
      // real action in the same synchronous pass, immune to that.
      saveBtn.addEventListener('mousedown', async () => {
        setError(errorEl, '');
        const newName = nameEl.value.trim();
        const isoDate = parseDDMMYYYY(dateEl.value);
        // Combined into one message, 2026-09-02, per explicit request to
        // match Investments' own validation exactly ("Please enter both
        // a ticker and a company name.") -- was two separate checks
        // ("Name is required." / "Please check your date."), fired one
        // at a time depending on which field happened to be wrong.
        if (!newName || !isoDate) {
          setError(errorEl, 'Please enter both a name and a date.');
          return;
        }
        const { error } = await supabase
          .from('renewal_items')
          .update({ item_name: newName, expiry_date: isoDate, updated_at: new Date().toISOString(), notified_at: null })
          .eq('id', item.id);
        if (!error) {
          // Rebuild only THIS row back to its normal view -- every other
          // row keeps whatever state it was already in (open or not).
          const updatedItem = { ...item, item_name: newName, expiry_date: isoDate };
          openRows.delete(row);
          row.replaceWith(buildItemRow(updatedItem));
        } else {
          setError(errorEl, 'Could not save — please check your connection and try again.');
        }
      });

      // mousedown, not click -- same reasoning as Save just above.
      deleteBtn.addEventListener('mousedown', async () => {
        setError(errorEl, '');
        const { error } = await supabase.from('renewal_items').delete().eq('id', item.id);
        if (!error) {
          // Remove only THIS row -- every other open edit panel is
          // untouched, same reasoning as Save above.
          openRows.delete(row);
          row.remove();
          if (!itemList.children.length) {
            itemList.innerHTML = '<div class="empty-state">Nothing tracked yet — add your first renewal above.</div>';
          }
        } else {
          setError(errorEl, 'Could not delete — please check your connection and try again.');
        }
      });

      const fields = document.createElement('div');
      fields.className = 'edit-fields';
      fields.append(nameEl, dateEl);

      const actions = document.createElement('div');
      actions.className = 'edit-actions';
      actions.append(saveBtn, deleteBtn);

      const editRow = document.createElement('div');
      editRow.className = 'edit-row';
      editRow.append(fields, actions);

      panel.append(editRow, errorEl);
      row.replaceChild(panel, countdown);
      name.remove();
      openRows.set(row, item);
    }

    // CLOSING AN OPEN ITEM (owner, 2026-10-05: an open card "just stays
    // there"; the same rule on Renewals and Investments, "just mirror them";
    // chosen for consistency with the "+" panel). An open item used to close
    // only through Save or Delete. Now, like the "+" panel: a press anywhere
    // outside it closes it WITHOUT saving (back to its normal row, the
    // unsaved typing dropped); pressing another item opens that one and
    // closes this one; Escape closes it. A press inside it (fields, Save,
    // Delete) keeps it open. A press is the browser's own press, or a
    // finger lifting on plain space without scrolling (onPress, above). This
    // check runs FIRST,
    // before the row's own opener: opening removes the name line that was
    // pressed, so afterwards the press could no longer be traced to its row
    // (found in testing 2026-10-05: it closed the row it had just opened).
    const openRows = new Map(); // open row element -> its item as last saved
    function closeOtherRows(keepRow) {
      for (const [row, item] of openRows) {
        if (row === keepRow) continue;
        openRows.delete(row);
        if (row.isConnected) row.replaceWith(buildItemRow(item));
      }
    }
    onPress((target) => {
      if (!openRows.size) return;
      closeOtherRows(target.closest ? target.closest('.item') : null);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && openRows.size) closeOtherRows(null);
    });

    addBtn.addEventListener('click', async () => {
      setError(addDateError, '');
      const name = nameInput.value.trim();
      const isoDate = parseDDMMYYYY(dateInput.value);
      // Combined into one message, 2026-09-02, per explicit request to
      // match Investments' own validation exactly ("Please enter both a
      // ticker and a company name.") -- was two separate checks ("Name
      // is required." / "Please check your date."), fired one at a time
      // depending on which field happened to be wrong; also applied to
      // the edit panel's identical Save validation just above, so both
      // save paths stay consistent with each other, same as before.
      if (!name || !isoDate) {
        setError(addDateError, 'Please enter both a name and a date.');
        return;
      }

      const { data, error } = await supabase
        .from('renewal_items')
        .insert({ item_name: name, expiry_date: isoDate })
        .select()
        .single();

      if (!error && data) {
        clearTimeout(collapseTimer);
        closeAddPopover();
        // Prepend just the new row -- doesn't disturb any edit panel
        // already open elsewhere in the list, same reasoning as Save/Delete.
        const emptyState = itemList.querySelector('.empty-state');
        if (emptyState) emptyState.remove();
        itemList.prepend(buildItemRow(data));
      } else {
        setError(addDateError, 'Could not save — please check your connection and try again.');
      }
    });

    // The list loads only for the signed-in owner (door.js; at once when it
    // already knew the owner). Nothing fetches or renders for anyone else.
    PrimeLevelDoor.whenOwner(loadItems);
    PrimeLevelDoor.gate(supabase);
  </script>
  <script>
    // Registered purely so the browser offers "Install" -- see sw.js for
    // why it deliberately does no caching.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
